<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZASHA.ONLINE</title>
<meta name="description" content="TaskFlow adalah aplikasi manajemen tugas berbasis web, disusun per proyek, dengan sub-tugas bertingkat tanpa batas, progres otomatis, kategori & prioritas, deadline, pencarian & filter, serta ekspor laporan PDF profesional. Data tersimpan real-time di Firebase Firestore." />
<meta property="og:title" content="TaskFlow — TODO App" />
<meta property="og:description" content="Aplikasi manajemen tugas per proyek dengan sub-tugas bertingkat, progres otomatis, kategori & prioritas, deadline, pencarian & filter, dan ekspor laporan PDF. Real-time via Firebase Firestore." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://todo.zasha.online" />
<meta property="og:site_name" content="TaskFlow" />
<style>
  :root {
    --bg: #eef2f2;
    --bg-card: #ffffff;
    --border: #c6d2d2;
    --text-primary: #16211f;
    --text-secondary: #46534f;
    --accent: #0f6e6e;
    --accent-hover: #0a5454;
    --danger: #b33a30;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at 50% 20%, #ffffff 0%, #e4eceb 70%);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .wrap { text-align: center; width: 100%; max-width: 700px; }
  .title {
    font-size: clamp(48px, 18vw, 224px);
    font-weight: 800;
    letter-spacing: -0.03em;
    white-space: nowrap;
    background: linear-gradient(135deg, #16211f, #0f6e6e);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
  }
  .brand {
    margin-top: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--accent);
  }
  form { margin-top: 56px; display: flex; justify-content: center; }
  input[type="password"] {
    width: 160px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text-primary);
    padding: 8px 4px;
    font-size: 14px;
    text-align: center;
    letter-spacing: 3px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="password"]::placeholder { color: transparent; }
  input[type="password"]:focus { border-color: var(--accent); }
  input[type="password"]:focus::placeholder { color: var(--text-secondary); }
  .error {
    color: var(--danger);
    font-size: 12px;
    min-height: 16px;
    margin-top: 10px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">TODO</div>
    <div class="brand">ZASHA.ONLINE</div>

    <form id="gateForm">
      <input type="password" id="pwInput" placeholder="Password" autofocus autocomplete="off" />
    </form>
    <div class="error" id="errorMsg"></div>
  </div>

  <script>
    const PASSWORD = "zasha";
    const SESSION_KEY = "taskflow_authed";

    if (sessionStorage.getItem(SESSION_KEY) === "1") {
      window.location.replace("index.html");
    }

    document.getElementById("gateForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const val = document.getElementById("pwInput").value;
      if (val === PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, "1");
        window.location.href = "index.html";
      } else {
        document.getElementById("errorMsg").textContent = "Password salah.";
        document.getElementById("pwInput").value = "";
        document.getElementById("pwInput").focus();
      }
    });
  </script>
</body>
</html>
