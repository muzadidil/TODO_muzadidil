<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaskFlow — TODO</title>
<link rel="stylesheet" href="style.css" />
<script>
  if (sessionStorage.getItem("taskflow_authed") !== "1") {
    window.location.replace("gate.html");
  }
</script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">TaskFlow</span>
        <button class="logout-btn" id="logoutBtn" title="Keluar">⏻</button>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-filter="all">
          <span class="nav-icon">☰</span> Semua Tugas
        </button>
        <button class="nav-item" data-filter="today">
          <span class="nav-icon">◷</span> Hari Ini
        </button>
        <button class="nav-item" data-filter="active">
          <span class="nav-icon">○</span> Belum Selesai
        </button>
        <button class="nav-item" data-filter="completed">
          <span class="nav-icon">✓</span> Selesai
        </button>
        <button class="nav-item" data-filter="overdue">
          <span class="nav-icon">⚠</span> Terlambat
        </button>
      </nav>

      <div class="nav-section-title section-with-action">
        <span>Proyek</span>
        <button class="icon-btn" id="addProjectBtn" title="Tambah proyek">+</button>
      </div>
      <div class="project-add-row" id="projectAddRow" style="display:none;">
        <input type="text" id="projectNameInput" placeholder="Nama proyek... (Enter)" />
      </div>
      <nav class="nav projects" id="projectList">
        <!-- Projects rendered here -->
      </nav>

      <div class="nav-section-title">Kategori</div>
      <nav class="nav categories" id="categoryList">
        <button class="nav-item cat-item active" data-category="all">
          <span class="cat-dot" style="background:#6b7280"></span> Semua
        </button>
        <button class="nav-item cat-item" data-category="kerja">
          <span class="cat-dot" style="background:#60a5fa"></span> Kerja
        </button>
        <button class="nav-item cat-item" data-category="pribadi">
          <span class="cat-dot" style="background:#34d399"></span> Pribadi
        </button>
        <button class="nav-item cat-item" data-category="belajar">
          <span class="cat-dot" style="background:#fbbf24"></span> Belajar
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="progress-card">
          <div class="progress-card-label" id="sidebarProgressLabel">Progress Keseluruhan</div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="sidebarProgressFill"></div>
          </div>
          <div class="progress-card-value" id="sidebarProgressText">0%</div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="viewTitle">Semua Tugas</h1>
          <p id="viewSubtitle">Kelola semua tugasmu di satu tempat</p>
        </div>
        <div class="topbar-actions">
          <button id="exportPdfBtn" class="export-btn" title="Export laporan progres PDF">📄 Export PDF</button>
          <button id="copyTextBtn" class="export-btn" title="Salin daftar tugas sebagai teks">📋 Salin Teks</button>
          <div class="search-box">
            <span class="search-icon">⌕</span>
            <input type="text" id="searchInput" placeholder="Cari tugas..." />
          </div>
        </div>
      </header>

      <section class="stats-row">
        <div class="stat-card">
          <div class="stat-icon stat-icon-total">☰</div>
          <div>
            <div class="stat-value" id="statTotal">0</div>
            <div class="stat-label">Total Tugas</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon stat-icon-active">○</div>
          <div>
            <div class="stat-value" id="statActive">0</div>
            <div class="stat-label">Belum Selesai</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon stat-icon-done">✓</div>
          <div>
            <div class="stat-value" id="statDone">0</div>
            <div class="stat-label">Selesai</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon stat-icon-progress">%</div>
          <div>
            <div class="stat-value" id="statProgress">0%</div>
            <div class="stat-label">Progress</div>
          </div>
        </div>
      </section>

      <section class="add-task-card">
        <input type="text" id="taskInput" placeholder="Tambah tugas baru... (tekan Enter)" />
        <select id="taskProject" title="Proyek">
          <option value="">Tanpa Proyek</option>
        </select>
        <select id="taskCategory">
          <option value="kerja">Kerja</option>
          <option value="pribadi">Pribadi</option>
          <option value="belajar">Belajar</option>
        </select>
        <select id="taskPriority">
          <option value="low">Rendah</option>
          <option value="medium" selected>Sedang</option>
          <option value="high">Tinggi</option>
        </select>
        <button type="button" id="taskLinkBtn" title="Tambah link">🔗</button>
        <button type="button" id="taskDeadlineBtn" title="Tambah deadline">📅</button>
        <button id="addTaskBtn">+ Tambah</button>
      </section>
      <div class="link-input-row" id="taskLinkRow" style="display:none;">
        <input type="url" id="taskLinkInput" placeholder="https://..." />
      </div>
      <div class="link-input-row" id="taskDeadlineRow" style="display:none;">
        <input type="date" id="taskDeadlineInput" />
      </div>

      <section class="filter-row">
        <div class="filter-chips" id="priorityFilters">
          <button class="chip active" data-priority="all">Semua Prioritas</button>
          <button class="chip" data-priority="high">🔴 Tinggi</button>
          <button class="chip" data-priority="medium">🟡 Sedang</button>
          <button class="chip" data-priority="low">🟢 Rendah</button>
        </div>
        <select id="sortSelect">
          <option value="newest">Terbaru</option>
          <option value="oldest">Terlama</option>
          <option value="priority">Prioritas</option>
          <option value="due">Tenggat Waktu</option>
        </select>
      </section>

      <section class="task-list" id="taskList">
        <!-- Tasks rendered here -->
      </section>

      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🗒️</div>
        <p>Belum ada tugas. Tambahkan tugas pertamamu!</p>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="exportModalOverlay">
    <div class="modal-box">
      <h3 id="exportModalTitle">Export Laporan PDF</h3>
      <p class="modal-sub" id="exportModalSub">Pilih cakupan laporan yang ingin diexport.</p>
      <div class="modal-options">
        <button type="button" class="modal-option" id="exportAllOption">
          <span class="modal-option-title">Seluruh Proyek</span>
          <span class="modal-option-desc">Semua proyek digabung dalam satu laporan, dikelompokkan per proyek.</span>
        </button>
        <button type="button" class="modal-option" id="exportOneOption">
          <span class="modal-option-title">Per Proyek</span>
          <span class="modal-option-desc">Pilih satu proyek untuk dilaporkan secara terpisah.</span>
        </button>
      </div>
      <div class="modal-project-picker" id="exportProjectPicker" style="display:none;">
        <select id="exportProjectSelect"></select>
        <button type="button" id="exportProjectConfirmBtn">Export</button>
      </div>
      <button type="button" class="modal-close" id="exportModalClose">✕</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("logoutBtn")?.addEventListener("click", () => {
        sessionStorage.removeItem("taskflow_authed");
        window.location.replace("gate.html");
      });
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
